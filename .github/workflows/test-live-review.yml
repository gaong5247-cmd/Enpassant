name: Test ANALYZE live review
on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - ".github/workflows/test-live-review.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: "12.15.0"

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm exec tsc --noEmit

      - name: Test ANALYZE variation review and mistake classification
        run: pnpm exec vitest run src/utils/tests/liveReview.test.ts
